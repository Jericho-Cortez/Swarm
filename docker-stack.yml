version: "3.8"

services:
  registry:
    image: registry:2
    ports:
      - "5000:5000"
    volumes:
      - registry_data:/var/lib/registry
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname == swarm-manager
      restart_policy:
        condition: on-failure
    networks:
      - backend

  mariadb:
    image: mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD: rootpass
      MARIADB_DATABASE: appdb
      MARIADB_USER: appuser
      MARIADB_PASSWORD: apppass
    volumes:
      - mariadb_data:/var/lib/mysql
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname == swarm-manager
      restart_policy:
        condition: on-failure
    networks:
      - backend

  php:
    image: php:8.2-fpm
    volumes:
      - ./app:/var/www/html
    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure
    networks:
      - backend

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./app:/var/www/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure
    networks:
      - backend

  code-server:
    image: lscr.io/linuxserver/code-server:latest
    environment:
      - PASSWORD=Admin123!
      - TZ=Europe/Paris
    ports:
      - "8443:8443"
    volumes:
      - code_data:/config
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname == swarm-manager
      restart_policy:
        condition: on-failure
    networks:
      - backend

networks:
  backend:
    driver: overlay

volumes:
  registry_data:
    driver: local
    driver_opts:
      type: nfs
      o: addr=192.168.10.20,nolock,soft,rw
      device: ":/srv/nfs/registry"

  mariadb_data:
    driver: local
    driver_opts:
      type: nfs
      o: addr=192.168.10.20,nolock,soft,rw
      device: ":/srv/nfs/mariadb"

  code_data:
    driver: local
    driver_opts:
      type: nfs
      o: addr=192.168.10.20,nolock,soft,rw
      device: ":/srv/nfs/code"